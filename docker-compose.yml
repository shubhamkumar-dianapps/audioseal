services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-audioseal_db}
      POSTGRES_USER: ${DB_USER:-audioseal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-audioseal_user} -d ${DB_NAME:-audioseal_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --settings=core.settings.base &&
             gunicorn core.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --timeout 120
             --access-logfile -
             --error-logfile -"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.base
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
